<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Methods</title>
</head>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- div: a red background, white text, font size of 32 px, center aligned, and bold. ADD USING EXTERNAL.-->
    <div>
        Hello, World. My background is red, my font is white, I'm 32px and center aligned, and I am BOLD. Styled with the external method.
    </div>

<!-- p: a green background, white text, and font size of 18px. ADD USING INTERNAL.-->
<head>
    <style>
        p {
            background-color: green;
            color: white;
            font-size: 18px;
        }
    </style>
</head> 
<body>
    <p>
        I have a green background, white text, font size of 18px, and am styled using the internal method.
    </p>
</body>

<!-- button: an orange background and font size of 18px. ADD USING INLINE.-->
<body>
    <button style="font-size: 18px; background-color: orange;">
        Inline Method
    </button>
</body>

</body>
</html>
